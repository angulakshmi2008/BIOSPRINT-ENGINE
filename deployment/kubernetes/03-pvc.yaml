apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: biosprint-data-pvc
  namespace: biosprint-engine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: biosprint-uploads-pvc
  namespace: biosprint-engine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
