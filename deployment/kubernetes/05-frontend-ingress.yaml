apiVersion: apps/v1
kind: Deployment
metadata:
  name: biosprint-frontend
  namespace: biosprint-engine
  labels:
    app: biosprint-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: biosprint-frontend
  template:
    metadata:
      labels:
        app: biosprint-frontend
    spec:
      containers:
        - name: frontend
          image: biosprint/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: biosprint-frontend-service
  namespace: biosprint-engine
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: biosprint-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biosprint-ingress
  namespace: biosprint-engine
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - biosprint.research.org
      secretName: biosprint-tls-cert
  rules:
    - host: biosprint.research.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: biosprint-backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: biosprint-frontend-service
                port:
                  number: 80
