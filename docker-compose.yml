services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: biosprint-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=biosprint_super_secret_jwt_key_fair_provenance_2026_laboratory
      - DB_FILE=data/biosprint.db
      - UPLOADS_DIR=uploads
      - CLIENT_ORIGIN=http://localhost:3000
    volumes:
      - biosprint_db_data:/app/data
      - biosprint_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biosprint-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  biosprint_db_data:
    driver: local
  biosprint_uploads:
    driver: local
